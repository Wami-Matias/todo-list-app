<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List — Local Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 As Minhas Tarefas</h1>
            <p>Organize o teu dia com esta lista simples</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Adiciona uma nova tarefa..."
                autocomplete="off"
            >
            <button id="addBtn" class="btn-add">Adicionar</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Ativas</button>
            <button class="filter-btn" data-filter="completed">Completas</button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- Tarefas aparecem aqui -->
        </ul>

        <div class="empty-state">
            <p>Sem tarefas. Adiciona uma para começar!</p>
        </div>

        <div class="stats">
            <span id="totalTasks">0 tarefas</span>
            <span id="completedTasks">0 completas</span>
        </div>

        <button id="clearBtn" class="btn-clear">Limpar completas</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
