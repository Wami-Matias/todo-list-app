<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Organiza o teu dia</p>
      <h1>Minhas tarefas</h1>
      <p class="subtitle">Uma lista simples, guardada automaticamente no teu dispositivo.</p>
    </header>

    <form id="taskForm" class="add-task">
      <input id="taskInput" type="text" placeholder="Adicionar uma tarefa..." maxlength="120" autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filtrar tarefas">
        <button class="filter active" data-filter="all" type="button">Todas</button>
        <button class="filter" data-filter="active" type="button">Ativas</button>
        <button class="filter" data-filter="completed" type="button">Concluídas</button>
      </div>
      <button id="clearCompleted" class="clear" type="button">Limpar concluídas</button>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <p id="emptyState" class="empty">Ainda não tens tarefas.</p>

    <footer class="stats">
      <span id="taskCount">0 tarefas</span>
      <span id="completedCount">0 concluídas</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
